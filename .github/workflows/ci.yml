name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  CGO_ENABLED: 1
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
  # Increment when changing Qt/compiler families to invalidate cached cgo objects.
  CGO_CACHE_EPOCH: '3'

jobs:
  build:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Initialize build directory
        run: mkdir -p build

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev

      - name: Configure C++ diagnostics
        run: |
          printf '' | g++ -x c++ -Wno-sfinae-incomplete -fsyntax-only -
          echo 'CGO_CXXFLAGS=-Wno-sfinae-incomplete' >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          # Do not restrict `archives`: the Qt desktop package includes matching
          # ICU runtime libraries that QtCore needs but Ubuntu does not provide.
          cache-key-prefix: slideit-qt-full

      - name: Verify toolchain
        run: |
          go version
          task --version
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "CGO_CXXFLAGS=${CGO_CXXFLAGS:-}"
          pkg-config --modversion Qt6Core Qt6Qml Qt6Quick
          ldd "$QT_ROOT_DIR/lib/libQt6Core.so" | tee build/qt6core-dependencies.txt
          ! grep -q "not found" build/qt6core-dependencies.txt

      - name: Cache Go and MIQT build outputs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-cgo-${{ env.CGO_CACHE_EPOCH }}-linux-x86_64-${{ env.QT_VERSION }}-${{ hashFiles('go.sum') }}

      - name: Build and test
        run: task ci

      - name: Archive Linux binary
        run: tar -C build -czf build/slideit-linux-x86_64.tar.gz slideit

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: slideit-linux-x86_64
          path: build/slideit-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish latest release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release asset
        run: test -f release-assets/slideit-linux-x86_64.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          latest_flag=(--latest)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag+=(--prerelease)
            latest_flag=()
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/slideit-linux-x86_64.tar.gz \
            --verify-tag \
            --generate-notes \
            --title "Slideit $GITHUB_REF_NAME" \
            "${latest_flag[@]}" \
            "${prerelease_flag[@]}"
